<!DOCTYPE html>
<html lang="ko">
<head>
  <script src="https://kit.fontawesome.com/c8e7849976.js" crossorigin="anonymous"></script>
  <meta charset="UTF-8">
  <title>Instagram Post Clone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="insta-post">
    <div class="header">
      <img src="myimage2.jpg" alt="프로필" class="profile-pic">
      <span class="username">loveliong_13</span>
      <span class="right-icon"><i class="fa-solid fa-bars"></i></span>
    </div>
    <div class="post-image">
      <img src="myimage.jpg" alt="강민이 듣는 사진">
    </div>
    <div class="insight">
      <p>인사이트 보기</p>
    </div>
    <div class="icon-bar">
      <div class="left-icons">
        <span><i class="fa-solid fa-heart"></i> 22</span>
        <span><i class="fa-regular fa-comment"></i> 2</span>
        <span><i class="fa-regular fa-paper-plane"></i></span>
        <span><i class="fa-solid fa-repeat"></i></span>
      </div>
      <div class="right-icon">
        <i class="fa-regular fa-bookmark"></i>
      </div>
    </div>
    <div class="likes">
      <strong>11d_g20</strong>님 외 여러 명이 좋아합니다
    </div>
    <div class="caption comment-line">
      <div><strong>loveliong_13</strong> 오 멋진데 ㅋㅋㅋㅋㅋ</div>
      <span><i class="fa-regular fa-heart"></i></span>
    </div>
    <div class="comment comment-line">
      <div><strong>ooh.__99</strong> 사진 잘 나왔다</div>
      <span><i class="fa-regular fa-heart"></i></span>
    </div>
    <div class="comment comment-line">
      <div><strong>ckswn_owo</strong> 나도 테니스 치고 싶다</div>
      <span><i class="fa-regular fa-heart"></i></span>
    </div>
    <div class="date">3월 16일</div>
  </div>
</body>
</html>
